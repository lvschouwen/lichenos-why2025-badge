# App boundary check configuration, read by tools/check_app_boundary.sh (#178). Plain shell, sourced.
# The rules and the reasoning are in docs/app-api.md ("Boundary check").
#
# Scope: only the app components below are checked. The system apps in components/lichen_shell are out of scope for
# rules A and B for now: they still call board/backlight.h and friends directly and move out in #180.

# Directories under firmware/components/ that hold an app. Add a component here when it becomes an app (#180).
APP_COMPONENTS="mesh"

# Rule A and B: components an app may REQUIRE / PRIV_REQUIRES and take headers from (docs/app-api.md, "What an app may
# use"). lichen_api brings lvgl and lichen_notify along, so their headers are fine. Names that are not components
# of this repo (freertos, esp_timer, heap, mbedtls, lvgl) are plain libraries.
ALLOWED_COMPONENTS="lichen_api lichen_notify lichen_clock lichen_random lora fw_console psram_guard
                    freertos esp_timer heap mbedtls lvgl"

# Exceptions that are still open, "<app>:<component>", each with its follow-up (docs/app-api.md, "Exceptions still open").
#   mesh:nvs_flash  the legacy badge_fw/identity hand-over (migrate_identity), kept by decision; #123 moved the keys.
#   mesh:sdcard     the message journal's sd_begin/sd_end batches (#98), until lichen_fs.h has an SD batch call.
EXCEPT_COMPONENTS="mesh:nvs_flash mesh:sdcard"

# Rule B: headers that are not in this repo's components and are fine to include: libc, libstdc++ and the plain IDF
# libraries behind ALLOWED_COMPONENTS. Shell glob patterns on the include text. Headers found inside the app's own
# directory, the third-party trees below, or an allowed component never need to be listed.
SYSTEM_HEADERS="assert.h ctype.h errno.h inttypes.h math.h new stdarg.h stdatomic.h stdbool.h stddef.h stdint.h
                stdio.h stdlib.h string.h strings.h time.h unistd.h limits.h sys/*.h
                freertos/*.h esp_log.h esp_timer.h esp_heap_caps.h esp_attr.h mbedtls/*.h psa/*.h lvgl.h"

# Rule B: header exceptions, "<app>:<include text>" (headers of IDF components that are not allowed above).
#   mesh:nvs.h  the same legacy identity hand-over as mesh:nvs_flash.
EXCEPT_HEADERS="mesh:nvs.h"

# Rule B: the app's own and bundled third-party include roots, relative to firmware/, the PRIV_INCLUDE_DIRS of the
# component (a header found under one of them belongs to the app). Per-app, "<app>:<dir>". MeshCore, its Crypto library, the Arduino shim and base64 are built
# into the mesh component (see its CMakeLists.txt).
APP_OWN_DIRS="mesh:components/mesh mesh:components/mesh/companion mesh:../meshcore/src mesh:../meshcore/examples/companion_radio
              mesh:../meshcore/lib/ed25519 mesh:../third_party/arduinolibs/libraries/Crypto
              mesh:../shared/arduino_shim mesh:../third_party/base64/src"

# Rule C: undefined symbols (nm -u) an app object must not have; shell globs. The OS owns these.
FORBIDDEN_SYMBOLS="esp_ota_* esp_wifi_* esp_efuse_* gpio_* esp_partition_* nvs_flash_init* nvs_flash_erase* ledc_*
                   i2c_* esp_restart"
# Not forbidden yet: xTaskCreate*. Apps still create their own tasks until lichen_task_start exists (#181); add
# "xTaskCreate*" above then. nvs_open/nvs_get_blob/... are the mesh:nvs_flash exception above.

# Rule C exceptions, "<app>:<symbol>" (none today: mesh references none of the forbidden symbols).
EXCEPT_SYMBOLS=""
