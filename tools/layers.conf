# Layer map read by tools/check_layers.py (#218; design in #216). One directive per line, '#' starts a comment.
#
# Layers (low to high): a component may depend on its own and lower layers unless layer-may says otherwise.
#   L0 platform  - IDF-level helpers every layer may use (console, PSRAM guard, random, assets)
#   L1 board     - HAL: display, keyboard, SD bus, storage (no NVS of its own: #224)
#   L2 drivers   - radios, sensors, LEDs, haptics, SD card
#   L3 services  - lichen_os (the gate's implementations, #220), notify, clock, net, boot, OTA, crash
#   L4 gate      - lichen_api: what apps may call, headers and pure logic (no hardware dependencies, #220)
#   L5 system    - lichen_shell, the privileged client of the gate
#   L6 apps      - mesh, lichen_apps: closed profile, the old app boundary (#178, #180)
#   main         - the composition root, may use everything
layer L0 platform
layer L1 board
layer L2 drivers
layer L3 services
layer L4 gate
layer L5 system
layer L6 apps
layer L7 main

# lichen_nvs (NVS init and encryption, #116) stays L0 for now; #235 revisits where the NVS owner lives.
component fw_console psram_guard lichen_random assets lichen_nvs L0
component board esp_lcd_st7703 esp_tca8418 storage L1
component sdcard sensors lora c6link lichen_led lichen_haptics battery lichen_audio L2
component lichen_os lichen_notify lichen_clock lichen_net lichen_boot lichen_mdns ota crash L3
component lichen_api L4
component lichen_shell L5
component mesh lichen_apps L6
component main L7

# The gate has no hardware dependencies (#216): it may use L0 and itself only.
layer-may L4 L0 L4
# The shell is a privileged client of the gate, never of drivers.
layer-may L5 L0 L4 L5
# Apps reach the OS through lichen_api only, plus the peers below.
layer-may L6 L4 L6

# Peers: extra allowed dependencies of one component (app-api.md "What an app may use"). Each one is a debt to remove
# or a reasoned exception; say why.
# lichen_os implements the gate's headers (decision 1 of #216: the gate is a header API), so it includes them and uses
# the gate's pure helpers (app_ns, fs_path, crashlog_fmt, settings_backup ...); the gate itself never depends on it.
# Rule C counts a call to a function a lichen_api header declares and lichen_os or lichen_notify defines as a call to
# the gate (#220, #245; GATE_IMPL in check_layers.py).
peer lichen_os lichen_api
# lichen_notify implements the gate's notification headers the same way (#245: lichen_notify.h, notify_os.h and
# notify_entry.h live in lichen_api, so the gate no longer depends on the service); it uses nothing else of the gate.
peer lichen_notify lichen_api
# lichen_api brings lvgl along (and lichen_notify.h since #245, so no app needs lichen_notify itself); apps call these
# helpers directly.
peer mesh lichen_clock lichen_random lora fw_console
# lichen_apps (#180): Weather and Timer read the clock, LoRa spectrum uses lora_app.h, QR registers a console command.
peer lichen_apps lichen_clock lora fw_console
# The headers an app may include of each peer (#283, app-api.md "What an app may use"): every other header of those
# components (lora_os.h, lora_internal.h, console_cmd.h, fw_store.h, key_raw.h, nvs_erase_os.h ...) is the OS's and a
# hard B. secure_wipe.h is fw_console's pure wipe for buffers that held a secret (mesh_wipe.h).
peer-headers mesh lichen_clock lichen_clock.h
peer-headers mesh lichen_random lichen_random.h
peer-headers mesh lora lora_app.h
peer-headers mesh fw_console fw_console.h secure_wipe.h
peer-headers lichen_apps lichen_clock lichen_clock.h
peer-headers lichen_apps lora lora_app.h
peer-headers lichen_apps fw_console fw_console.h

# Closed profile (apps): REQUIRES outside the repo may only name these libraries, and an include that is neither an
# own header nor a repo component's must match a system header glob.
closed L6 freertos esp_timer heap mbedtls lvgl lvgl__lvgl
headers L6 assert.h ctype.h errno.h inttypes.h math.h new stdarg.h stdatomic.h stdbool.h stddef.h stdint.h
headers L6 stdio.h stdlib.h string.h strings.h time.h unistd.h limits.h sys/*.h
# Per-component system headers: lichen_apps lists directories with POSIX opendir (Notepad's notes_store.c, host-tested)
# because lichen_fs has no listing call yet. mesh gets the same for the Arduino shim (#283): fs_shim.cpp is MeshCore's
# fs::FS over POSIX (opendir for openNextFile and format, open/fcntl for the buffered writes), and its nvs_flash.h
# stand-in needs esp_err_t. Future apps get none of them.
comp-headers lichen_apps dirent.h
comp-headers mesh dirent.h fcntl.h esp_err.h
headers L6 freertos/*.h esp_log.h esp_timer.h esp_attr.h mbedtls/*.h psa/*.h lvgl.h

# The app's own and bundled third-party include roots, relative to firmware/ (PRIV_INCLUDE_DIRS of the component):
# MeshCore, its Crypto library, the Arduino shim and base64 are built into the mesh component.
own-dir mesh components/mesh components/mesh/companion ../meshcore/src ../meshcore/examples/companion_radio
own-dir mesh ../meshcore/lib/ed25519 ../third_party/arduinolibs/libraries/Crypto ../shared/arduino_shim
own-dir mesh ../third_party/base64/src
# Third-party code built unchanged is not scanned (rule B); every other own-dir root is, as the app's own code: the
# Arduino shim (shared/arduino_shim) is Lichen's and compiled into mesh (#283).
vendored mesh ../meshcore/src ../meshcore/examples/companion_radio ../meshcore/lib/ed25519
vendored mesh ../third_party/arduinolibs/libraries/Crypto ../third_party/base64/src

# Rule C, forbidden for apps (nm -u): OS-only symbols. The lora_* names are lora_os.h (#179), apps use lora_app.h;
# xTaskCreate* is lichen_task_start (#181).
forbid L6 esp_ota_* esp_wifi_* esp_efuse_* gpio_* esp_partition_* nvs_flash_init* nvs_flash_erase* ledc_* i2c_*
forbid L6 esp_restart lora_start lora_ident lora_ident_live lora_stop lora_c6_* lora_set_send_hook lora_set_enabled
forbid L6 lora_enabled lora_set_switch_owner xTaskCreate*
# The settings registry (#310, #313): apps read a key's cached text through the gate's lichen_reg_get (lichen_reg.h)
# and set none. The transport (lora_os.h, the OS's way to the C6's keys), the service's own calls and every setter
# (reg_set, reg_cmd_set, the table's setters) are the OS's.
forbid L6 lora_reg_* lora_set_reg_hooks lora_get_requested lichen_reg_start lichen_reg_cached_text
forbid L6 reg_set reg_cmd_* reg_p4_* reg_proxy_*
# The shell reaches the PSRAM guard through lichen_sys_psram.h (#284): psram_guard is L0, so the layer rule lets the
# shell include it, this stops it. (The C6 link, LoRa and Wi-Fi are L2/L3: the layer rule already bars the shell.)
forbid L5 psram_speed_* psram_boot_* psram_dma_* psram_guard_* psram_heap_* psram_pattern_* psram_rotation_* psram_tuning_* psram_nvs_*
# lora's and psram_guard's internals (#283): lora_internal_send talks to the C6 without the owner claim; the sweep, TX
# and owner state machines and the C6 link are lora's own (lora_c6_* above). The PSRAM speed switch is the OS's, all
# of it (#280): no app holds for it since #353 removed the trial.
forbid L6 lora_internal_* lora_sweep_* lora_tx_* lora_owner_* psram_speed_*
# Plain heap calls (#283): invisible to the memory book (#181), so apps allocate with lichen_alloc / lichen_free.
# MeshCore's upstream `new` (operator new) is not a malloc symbol and stays a documented exception (app-api.md); its
# MyMesh.cpp's one malloc/free (the sign buffer, built unchanged) is the forbid-except below. It is keyed to the object
# file name in libmesh.a (MyMesh.cpp.obj); the checker fails when no object of that name uses malloc or free, so an
# upstream rename or fix shows up instead of dropping the exception.
forbid L6 malloc calloc realloc free strdup strndup
# The shell allocates the same way since #286 ("fw mem" counts it under the OS).
forbid L5 malloc calloc realloc free strdup strndup
forbid-except mesh MyMesh.cpp.obj malloc free
# lichen_ui_ops_set hands the gate the shell's navigation table (#221): an app setting it would take over every screen.
# lichen_ui_ops_later / _later_cancel are the gate's own widgets' way to the UI service (#286); apps use lichen_ui_call.
forbid L6 lichen_ui_ops_*
# An app's event, timer and group focus callbacks run as the app (#349): it registers them with lichen_ui_event_add,
# lichen_ui_timer_create and lichen_ui_group_focus_cb, whose trampoline enters its context. A raw registration would
# run as the OS; setting a descriptor's, timer's or group's external data would replace the record and make the
# trampoline call through a foreign pointer. Display and input-device events are the OS's.
forbid L6 lv_obj_add_event_cb lv_timer_create lv_timer_create_basic lv_timer_set_cb lv_group_set_focus_cb
forbid L6 lv_event_desc_set_external_data lv_timer_set_external_data lv_group_set_external_data
forbid L6 lv_display_add_event_cb lv_indev_add_event_cb
# The gate's system surface (#216 decision 1): lichen_sys_ui_lock and friends are the shell's and main's, never an app's
# (#225; apps hand work to the LVGL task with lichen_ui_call).
forbid L6 lichen_sys_*
# The radio switches (#360): apps read lichen_radio_get / lichen_airplane_get and listen; switching is the OS's (the
# shell's rows, the console). lichen_radio_set on lifts a thermal hold, so an app calling it could make a hot badge
# transmit. lichen_radio_set_lora_user names the radio's user (main, once at boot): an app setting it would take the
# LoRa pause and resume over.
forbid L6 lichen_radio_set lichen_radio_switch_set lichen_airplane_set lichen_radio_set_lora_user
# The current app (#230): lichen_sys_app.h's enter/leave would let an app run its code as another app or the OS. The
# app table's lookups (#340) would hand an app every other app's struct; an app knows only its own context.
forbid L6 lichen_ctx_enter lichen_ctx_leave lichen_app_count lichen_app_at lichen_app_by_id lichen_app_by_name
# notify_os.h is the shell's side of notifications (#245): the history of every app, do-not-disturb, the toast queue and
# the feedback hooks; notify_bind.h is lichen_os's wiring. Apps have lichen_notify.h only.
forbid L6 lichen_notify_start lichen_notify_save_now lichen_notify_set_clock lichen_notify_generation lichen_notify_ids
forbid L6 lichen_notify_get lichen_notify_mark_read_id lichen_notify_mark_read_upto lichen_notify_mark_all_read
forbid L6 lichen_notify_remove lichen_notify_clear_all lichen_notify_set_dnd lichen_notify_set_source_enabled
forbid L6 lichen_notify_next_toast lichen_notify_set_feedback lichen_notify_feedback lichen_notify_stats
forbid L6 lichen_notify_bind_store lichen_notify_set_state_hooks
# #340: another source's unread count and switch are the shell's (an app asks for its own: lichen_notify_source_enabled)
forbid L6 lichen_notify_unread lichen_notify_source_is_on
# The clock is the clock service's (app-api.md "What an app must not do", #280 audit): apps propose a time with
# clock_propose. abort is no way out of a state for an app (it reboots the badge as a crash).
forbid L6 settimeofday adjtime sntp_* esp_sntp_* abort

# Rule D, capabilities (#229; docs/app-api.md "Capabilities"). An accident and audit guard, not a security boundary.
# `cap NAME BIT` is the list, mirrored as CAP_NAME (1u << BIT) in lichen_api/lichen_caps.h. Declared now so the list
# need not be reopened: NET, RADIO_SCAN (#172), BT (#73), AUDIO (#67), BATTERY (#11) guard nothing an app reaches yet.
# SYSTEM is the shell's own apps: every capability. BACKGROUND: may start tasks (lichen_task_start) and may have a
# start_background hook; safe mode (#232) and Settings > Apps (#233) key on start_background, not on this capability.
cap LORA_TX 0
cap LORA_RX 1
cap LORA_BORROW 2
cap SD 3
cap NET 4
cap SECRETS 5
cap RAW_KEYS 6
cap CONSOLE 7
cap RESTART 8
cap BACKGROUND 9
cap HAPTICS 10
cap SENSORS 11
cap NOTIFY 12
cap RADIO_SCAN 13
cap BT 14
cap AUDIO 15
cap BATTERY 16
cap SYSTEM 17
#
# What each function of the gate and of the apps' peer headers needs (the manifest's capability column): the first
# cap-func line that names it, else the first cap-header line of its header, else none. '-' = none, A|B = either.
# LoRa (lora_app.h, called directly until #221's gate wrapper, so rule D is its only check): the radio's owner claims
# it (RX), a borrower claims it after lichen_radio_lora_pause (BORROW); sending is TX.
cap-func LORA_TX lora_send lora_send_state lora_set_tx_power
cap-func LORA_RX|LORA_BORROW lora_claim lora_release
cap-func LORA_RX lora_set_link_callback lora_set_rx_formatter lora_set_radio
cap-func LORA_BORROW lora_sweep lichen_radio_lora_pause lichen_radio_lora_resume
# Radio switching is the OS's (#222 review: app-api.md "Apps never switch radios"); reading the state is anyone's.
cap-func SYSTEM lichen_radio_set lichen_radio_switch_set lichen_airplane_set lichen_radio_set_lora_user
cap-func SYSTEM lichen_radio_apply_all lichen_radio_console_register
cap-func SD lichen_fs_sd_dir lichen_fs_sd_begin lichen_fs_sd_end
# CAP_SECRETS is an app's own secrets class (#288). The OS's protected secrets (#116: the Wi-Fi passwords, the OTA
# token) are SYSTEM (lichen_sys_net.h, lichen_sys_update.h); MeshCore's repeater passwords are its class.
cap-func SECRETS app_secret_get app_secret_set app_secret_erase
cap-func HAPTICS lichen_haptics_play
cap-func SYSTEM lichen_haptics_set_*
cap-func NOTIFY lichen_badge_set
cap-func - lichen_boot_degraded lichen_crashlog_after_crash
cap-func SYSTEM lichen_task_console_register lichen_mem_console_register
# fw_console.h: an app registers commands (CONSOLE) and replies; the rest of the console is the OS's
cap-func CONSOLE console_register console_register_dev
cap-func RESTART system_restart system_restart_asked
cap-func - console_reply console_reply_secret console_reply_private console_dev_gate console_dev_mode console_origin
cap-func - console_usb_hold_bind console_usb_hold_ok console_usb_hold_why console_boot_pending console_from_uart system_restart_would_wait system_restart_on_trial
cap-func - clock_is_set clock_is_approximate clock_build_epoch clock_propose clock_sync_info clock_source_text
cap-func - clock_source_age_s clock_save_age_s
cap-header SYSTEM fw_console.h lichen_clock.h
cap-header BACKGROUND lichen_task.h
cap-header SENSORS lichen_sensors.h
cap-header NOTIFY lichen_notify.h
cap-header RAW_KEYS lichen_keys.h
cap-header SYSTEM lichen_sys_*.h settings_backup.h settings_backup_io.h lichen_crashlog.h font_slots.h lichen_ui_ops.h
cap-header SYSTEM notify_os.h
#
# The apps: `app ID COMPONENT CAP... INTERNAL_RAM=KiB PSRAM=KiB`, mirrored in the app's lichen_app_t (.caps,
# .internal_ram_kib, .psram_kib; rule D fails when they differ). The budgets are what the app may hold (stacks,
# statics, its allocations) for the soak to compare (tools/soak_budgets.txt, #407); the first figures are the static
# floor (statics plus task stacks) and are measured on the bench. `app-objects ID FILES` names the app's sources in its
# component's archive; an object of an app archive that is no app's may use no capability.
app clock lichen_apps - INTERNAL_RAM=1 PSRAM=0
app-objects clock app_clock.c
app timer lichen_apps NOTIFY INTERNAL_RAM=1 PSRAM=1
app-objects timer app_timer.c timer_service.c timer_calc.c
app calc lichen_apps - INTERNAL_RAM=1 PSRAM=0
app-objects calc app_calc.c calc_eval.c calc_units.c
app weather lichen_apps SD NOTIFY BACKGROUND SENSORS INTERNAL_RAM=7 PSRAM=3
app-objects weather weather_app.c weather_screen.c weather_series.c
app notes lichen_apps SD BACKGROUND INTERNAL_RAM=9 PSRAM=0
app-objects notes app_notes.c notes_model.c notes_store.c
app qrcode lichen_apps CONSOLE INTERNAL_RAM=1 PSRAM=0
app-objects qrcode app_qr.c
app keytest lichen_apps RAW_KEYS INTERNAL_RAM=1 PSRAM=0
app-objects keytest app_keytest.c
app lora_spectrum lichen_apps LORA_BORROW BACKGROUND INTERNAL_RAM=5 PSRAM=0
app-objects lora_spectrum app_lora_spectrum.c lora_spectrum.c
app testcard lichen_apps - INTERNAL_RAM=1 PSRAM=0
app-objects testcard app_testcard.c
app meshcore mesh LORA_TX LORA_RX SD SECRETS CONSOLE RESTART BACKGROUND NOTIFY INTERNAL_RAM=48 PSRAM=24
# The whole mesh archive is MeshCore's: a second app in that component needs explicit object lists for both.
app-objects meshcore *
# The shell's own apps: SYSTEM, no budgets (they are the OS's)
app settings lichen_shell SYSTEM
app about lichen_shell SYSTEM
app files lichen_shell SYSTEM
app power lichen_shell SYSTEM
app bench lichen_shell SYSTEM
app crashlog lichen_shell SYSTEM
app relnotes lichen_shell SYSTEM
app notify lichen_shell SYSTEM

# Rule C, owner-only symbols: the first matching line wins, so the narrow lines come before their glob. A component
# that is not listed (the defining component itself aside) using the symbol is a violation. Owners are components on
# purpose: a new component gets no free pass by sitting on a low layer, it is added here with its reason. An owner may
# also be <=Ln (every component on layer Ln or lower); nothing uses that today.
#
# The LVGL lock and default group belong to the UI service, lichen_os/lichen_ui_call.c (#225): the shell and main take
# the lock through lichen_sys_ui.h, apps hand work over with lichen_ui_call, builders use lichen_ui_with_group. board
# keeps the port lock for the port setup only (display_start, keyboard_start at boot): it sits below lichen_os, so it
# cannot call the service, and the debug lock-owner check is armed after it (main.c start_keyboard).
owner-only lvgl_port_lock board lichen_os
owner-only lvgl_port_unlock board lichen_os
owner-only lv_group_set_default lichen_os
# Deferred calls (#286): lichen_sys_ui_call / lichen_ui_call queue them FIFO and lichen_sys_ui_cancel takes them back. A
# raw lv_async_call ran newest first and did not order against the queue, so it is the UI service's alone.
owner-only lv_async_call* lichen_os
#
# The app context (#230, #340): entering an app's context and looking an app up in the table are the OS's. The shell
# wraps every hook it calls, main the start_background calls, lichen_os its UI and task services (lichen_ui_call.c,
# lichen_task.c, lichen_mem.c); badges check an id is registered (lichen_badge.c), the console's "fw setup" finds an
# app by its alias (setup_screens.c). A driver or a service below them has no app to enter.
owner-only lichen_ctx_enter lichen_os lichen_shell main
owner-only lichen_ctx_leave lichen_os lichen_shell main
owner-only lichen_sys_app_ctx_at lichen_shell main
owner-only lichen_app_count lichen_shell main
owner-only lichen_app_at lichen_shell main
owner-only lichen_app_by_id lichen_os
owner-only lichen_app_by_name lichen_shell
# The console's test notices (#340) post under "test" and are lichen_notify's own ("fw notify test").
owner-only lichen_notify_post_test
# Developer mode (#373): the settings service binds its saved state, and only the OS turns it on or off outside fw dev
# (About's taps in lichen_shell, #374). mesh and lichen_apps see fw_console.h as a peer header and must not.
owner-only console_bind_dev_store lichen_os
owner-only console_dev_set lichen_os lichen_shell
# The shell's remote key checks (#377, bench_scope.h): only MeshCore binds the bench console scope and the chat on top.
# Another app binding its own would switch the scope and #badgetest rules off for every remote key.
owner-only bench_scope_bind mesh
# The console's USB hold (#289, fw_console.h): MeshCore's on-air allow list makes the console factory reset USB-only
# while it is on. Another binder could release that hold.
owner-only console_usb_hold_bind mesh
# What would boot another image (#420): only main binds ota's answer; another binder could hide a pending update.
owner-only console_bind_boot_pending main
owner-only bench_chat_bind mesh
owner-only bench_starts_bind mesh
# Hand-only actions (#400, key_cause.h): only the shell (raw keys, console commands) and the UI service (a queued call
# runs under the cause it was queued with) mark what set off the work running now, and only the shell binds the last
# LVGL key's origin; an app marking its own work as a hand's would start MeshCore from an injected key.
owner-only key_cause_enter lichen_shell lichen_os
owner-only key_cause_leave lichen_shell lichen_os
owner-only key_cause_bind_last_key lichen_shell
#
# NVS: the settings service (lichen_os since #220; #235 makes it the only owner) plus the sanctioned owners of #235,
# each with its reason: lichen_nvs (init and encryption, #116), lichen_boot (factory_reset.c enumerates namespaces),
# crash (panic path), psram_guard (runs before any service), c6link (the C6-proof keys, part of the #234 contract).
# board and sensors already left (#224: they take the settings through a bound getter/setter), and so did lichen_net
# (#235: its Wi-Fi credentials through a bound store, the passwords as the settings' secrets class); lichen_notify,
# lichen_led, lichen_haptics and fw_console migrate in #235.
owner-only nvs_open* lichen_os lichen_nvs lichen_boot crash psram_guard c6link
#
# Tasks: the components that start their own task today (a driver, a service or the console). Apps and the shell
# use lichen_task_start (#181, lichen_os implements it; #228 moved the shell onto it). lichen_net's is the
# c6wifi task, which moved with the Wi-Fi service out of c6link (#223): the same task, a new owner, no new task.
owner-only xTaskCreate* board c6link fw_console lichen_clock lichen_net lichen_notify lichen_os lora ota psram_guard sensors
#
# Heap: inspection calls (walk, integrity, monitor) stay with the console and the guards, the statistics (get_*) with
# those plus OTA's free-space report; every other heap_caps call (allocation, DMA/PSRAM placement) with the components
# that allocate this way today. The gate declares the wrapper, lichen_alloc, and lichen_os implements it (#228 moved the
# shell and mesh onto that; the shell's and main's heap figures are lichen_sys_mem.h).
owner-only heap_caps_walk fw_console psram_guard lichen_os
owner-only heap_caps_check_integrity fw_console psram_guard lichen_os
owner-only heap_caps_monitor_* fw_console psram_guard lichen_os
owner-only heap_caps_get_* fw_console psram_guard lichen_os ota
owner-only heap_caps_* assets board c6link crash fw_console lichen_os lichen_boot lichen_notify ota psram_guard sdcard
#
# The C6 link (docs/architecture.md "Two-chip contract", #234): c6link and lora are the L2 drivers that own it, and
# esp_hosted (a vendored IDF component, not a repo component, so it has no layer line) is reached only through them.
owner-only esp_hosted_* c6link lora
owner-only eh_* c6link lora
#
# The LoRa radio switch (#222): lora_switch_request is what "fw lora on|off" calls, and it switches LoRa off for good
# (the owner saves it). lora_switch.h sits in lora's public include dir, which mesh and lichen_apps reach as peers, so
# only lora itself may call it; everyone else goes through the OS switch (lichen_radio.h).
owner-only lora_switch_request lora
#
# "Is this image on trial" (#285): ota_trial.c reads the OTA data in one place and is the only one that marks the image
# valid; everyone else asks ota_image_trial_pending / ota_rolled_back (the shell through lichen_sys_update.h, the layers
# below ota through the hook main binds: psram_speed_boot, c6link's boot hooks, console_bind_slot_state).
owner-only esp_ota_get_state_partition ota
owner-only esp_ota_get_last_invalid_partition ota
owner-only esp_ota_mark_app_valid_cancel_rollback ota
#
# Flash mmap at runtime (#283, #31): while any page is mapped a flash write disables the cache and stalls the display.
# Assets are a boot-time PSRAM copy (esp_partition_read). No owner: no repo component may call them, a hard C (never
# baselined). esp_mmu_map* is the MMU API underneath (IDF 5+).
owner-only esp_partition_mmap
owner-only spi_flash_mmap*
owner-only esp_mmu_map*
