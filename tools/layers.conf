# Layer map read by tools/check_layers.py (#218; design in #216). One directive per line, '#' starts a comment.
#
# Layers (low to high): a component may depend on its own and lower layers unless layer-may says otherwise.
#   L0 platform  - IDF-level helpers every layer may use (console, PSRAM guard, random, assets)
#   L1 board     - HAL: display, keyboard, SD bus, storage (no NVS of its own: #224)
#   L2 drivers   - radios, sensors, LEDs, haptics, SD card
#   L3 services  - notify, clock, net, boot, OTA, crash (the OS services)
#   L4 gate      - lichen_api: what apps may call (target: no hardware dependencies, #220)
#   L5 system    - lichen_shell, the privileged client of the gate
#   L6 apps      - mesh: closed profile, the old app boundary (#178)
#   main         - the composition root, may use everything
layer L0 platform
layer L1 board
layer L2 drivers
layer L3 services
layer L4 gate
layer L5 system
layer L6 apps
layer L7 main

# lichen_nvs (NVS init and encryption, #116) stays L0 for now; #235 revisits where the NVS owner lives.
component fw_console psram_guard lichen_random assets lichen_nvs L0
component board esp_lcd_st7703 esp_tca8418 storage L1
component sdcard sensors lora c6link lichen_led lichen_haptics battery lichen_audio L2
component lichen_notify lichen_clock lichen_net lichen_boot lichen_mdns ota crash L3
component lichen_api L4
component lichen_shell L5
component mesh L6
component main L7

# The gate has no hardware dependencies (#216): it may use L0 and itself only.
layer-may L4 L0 L4
# The shell is a privileged client of the gate, never of drivers.
layer-may L5 L0 L4 L5
# Apps reach the OS through lichen_api only, plus the peers below.
layer-may L6 L4 L6

# Peers: extra allowed dependencies of one component (app-api.md "What an app may use"). Each one is a debt to remove
# or a reasoned exception; say why.
# lichen_api brings lvgl and lichen_notify along, apps use these helpers directly.
peer mesh lichen_notify lichen_clock lichen_random lora fw_console psram_guard

# Closed profile (apps): REQUIRES outside the repo may only name these libraries, and an include that is neither an
# own header nor a repo component's must match a system header glob.
closed L6 freertos esp_timer heap mbedtls lvgl lvgl__lvgl
headers L6 assert.h ctype.h errno.h inttypes.h math.h new stdarg.h stdatomic.h stdbool.h stddef.h stdint.h
headers L6 stdio.h stdlib.h string.h strings.h time.h unistd.h limits.h sys/*.h
headers L6 freertos/*.h esp_log.h esp_timer.h esp_heap_caps.h esp_attr.h mbedtls/*.h psa/*.h lvgl.h

# The app's own and bundled third-party include roots, relative to firmware/ (PRIV_INCLUDE_DIRS of the component):
# MeshCore, its Crypto library, the Arduino shim and base64 are built into the mesh component.
own-dir mesh components/mesh components/mesh/companion ../meshcore/src ../meshcore/examples/companion_radio
own-dir mesh ../meshcore/lib/ed25519 ../third_party/arduinolibs/libraries/Crypto ../shared/arduino_shim
own-dir mesh ../third_party/base64/src

# Rule C, forbidden for apps (nm -u): OS-only symbols. The lora_* names are lora_os.h (#179), apps use lora_app.h;
# xTaskCreate* is lichen_task_start (#181).
forbid L6 esp_ota_* esp_wifi_* esp_efuse_* gpio_* esp_partition_* nvs_flash_init* nvs_flash_erase* ledc_* i2c_*
forbid L6 esp_restart lora_start lora_ident lora_ident_live lora_stop lora_c6_* lora_set_send_hook lora_set_enabled
forbid L6 lora_enabled xTaskCreate*

# Rule C, owner-only symbols: the first matching line wins, so the narrow lines come before their glob. A component
# that is not listed (the defining component itself aside) using the symbol is a violation. Owners are components on
# purpose: a new component gets no free pass by sitting on a low layer, it is added here with its reason. An owner may
# also be <=Ln (every component on layer Ln or lower); nothing uses that today.
#
# The LVGL lock and default group belong to the UI service (board's port setup and the gate's lichen_ui today; the
# UI service of #225 takes over, then only it stays here).
owner-only lvgl_port_lock board lichen_api
owner-only lvgl_port_unlock board lichen_api
owner-only lv_group_set_default lichen_api
#
# NVS: the settings service (lichen_api until #220/#235 move it) plus the sanctioned owners of #235, each with its
# reason: lichen_nvs (init and encryption, #116), lichen_boot (factory_reset.c enumerates namespaces), crash (panic
# path), psram_guard (runs before any service), c6link (the C6-proof keys, part of the #234 contract). board
# (backlight, #224), lichen_notify, lichen_led, lichen_haptics, lichen_net and fw_console migrate in #224/#235.
owner-only nvs_open* lichen_api lichen_nvs lichen_boot crash psram_guard c6link
#
# Tasks: the components that start their own task today (a driver, a service or the console). Apps use
# lichen_task_start (#181, the gate owns it) and the shell moves to the task book in #228.
owner-only xTaskCreate* board c6link fw_console lichen_api lichen_clock lichen_notify lora ota psram_guard sensors
#
# Heap: inspection calls (walk, integrity, monitor) stay with the console and the guards, the statistics (get_*) with
# those plus OTA's free-space report; every other heap_caps call (allocation, DMA/PSRAM placement) with the components
# that allocate this way today. The gate wraps it as lichen_alloc (#228 moves the shell and mesh onto that).
owner-only heap_caps_walk fw_console psram_guard lichen_api
owner-only heap_caps_check_integrity fw_console psram_guard lichen_api
owner-only heap_caps_monitor_* fw_console psram_guard lichen_api
owner-only heap_caps_get_* fw_console psram_guard lichen_api ota
owner-only heap_caps_* assets board c6link crash fw_console lichen_api lichen_boot lichen_notify ota psram_guard sdcard
