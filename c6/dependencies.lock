dependencies:
  espressif/esp_hosted:
    dependencies:
    - name: idf
      version: '>=5.5'
    - name: espressif/esp_tinyusb
      rules:
      - if: target in [esp32s2, esp32s3, esp32s31]
      - if: $CONFIG{ESP_HOSTED_CP_TINYUSB_MANIFEST} == 1
      version: '>=2.2.0'
    - name: espressif/usb_host_cdc_acm
      rules:
      - if: target in [esp32p4]
      - if: $CONFIG{ESP_HOSTED_HOST_USB_CDC_ACM_MANIFEST} == 1
      version: '*'
    - name: espressif/iot_usbh_rndis
      rules:
      - if: target in [esp32p4]
      - if: $CONFIG{ESP_HOSTED_HOST_USB_RNDIS_MANIFEST} == 1
      version: ^0.5.2
    - name: cherry-embedded/cherryusb
      rules:
      - if: target in [esp32p4]
      - if: $CONFIG{ESP_HOSTED_HOST_USB_CHERRYUSB_MANIFEST} == 1
      version: '>=1.6.0'
    source:
      path: ../esp_hosted
      type: local
    targets:
    - esp32
    - esp32s2
    - esp32s3
    - esp32s31
    - esp32c2
    - esp32c3
    - esp32c5
    - esp32c6
    - esp32c61
    - esp32h2
    - esp32h4
    - esp32h21
    - esp32p4
    version: 3.1.0
  idf:
    source:
      type: idf
    version: 6.1.1
  jgromes/radiolib:
    component_hash: cb296f02e54759f76d5aa3caa4079ad5dbdfa63d28db12003e499e5854dd7f43
    dependencies:
    - name: idf
      require: private
      version: '>=4.1'
    source:
      registry_url: https://components.espressif.com/
      type: service
    version: 8.0.0
direct_dependencies:
- espressif/esp_hosted
- idf
- jgromes/radiolib
manifest_hash: 58807287bc5ca7d3cb9e27408f9ef9e0a8c8c1050c0f0ee60ecea08d31aa3bf1
target: esp32c6
version: 3.0.0
