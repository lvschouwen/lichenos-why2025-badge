# Lichen OS v3 performance targets (#643, part of #642). One table per metric; the name is the PERF metric.
#
# key         PERF key that carries the compared value (unit is in the key name)
# direction   "lower" or "higher" is better
# v2          the v2 baseline, or "todo" when no v2 number exists in the repo or issues (never invented)
# v2_*        provenance: fw commit, workload/conditions, source issue
# target      absolute goal; omitted when it is relative (target_pct, computed against v2 once v2 is known)
# target_pct  relative goal in percent against v2 (negative = lower than v2)
# stretch     optional stretch goal
# ratchet     true once the metric is measurable on a v3 build; only then can it fail the gate
# tolerance_pct  allowed worsening against best.toml before the ratchet fails (default 5)
# Metrics for subsystems that do not exist yet stay ratchet = false and never block bring-up.

# ---- Boot ----
["boot.first_frame"]
key = "ms"
direction = "lower"
v2 = 1087
v2_fw = "fw-869e608d"
v2_conditions = "remote bench 2026-11-13, `fw ui perf` first frame stamp; clocks todo"
v2_source = "#205"
target = 2000
ratchet = false

