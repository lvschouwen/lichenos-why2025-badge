# Lichen OS v3 feasibility PoC (#607). Experimental: never merged into the v2 firmware tree until validated.
[workspace]
resolver = "2"
members = ["abi", "kernel", "apps/heartbeat", "apps/attacker", "probe-p4"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[profile.release]
opt-level = "s"
debug = true
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
