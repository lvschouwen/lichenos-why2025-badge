[package]
name = "lichen-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "lichen-kernel"
test = false
bench = false

[features]
default = ["qemu-virt"]
qemu-virt = []
esp32p4 = ["dep:lichen-platform-esp32p4"]
# Probe builds only (never default, never release): the #646 hang reproducer, and the full-window soak stage.
probe-646 = ["lichen-kcore/probe-646"]
soak-646 = []

[dependencies]
lichen-abi = { path = "../abi" }
lichen-kcore = { path = "../kcore" }
lichen-platform-esp32p4 = { path = "../platform/esp32p4", optional = true }
